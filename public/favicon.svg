<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F0606" />
      <stop offset="85%" stop-color="#08090D" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="neonRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A52" />
      <stop offset="50%" stop-color="#F12B25" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F12B25" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#F12B25" />
    </linearGradient>
  </defs>

  <!-- Circular Void Black Canvas -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" />
  
  <!-- Outer Neon Pulse Ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.9" />

  <!-- The Iconic 3-Peak Red Neon Crown Logo -->
  <g filter="url(#neonRedGlow)">
    <!-- Crown base & peaks -->
    <path
      d="M14 44 L17 26 L26 34 L32 18 L38 34 L47 26 L50 44 Z"
      fill="url(#crownGrad)"
      stroke="#FF8B85"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Crown bottom bar -->
    <path
      d="M14 45 L50 45 L48 48 L16 48 Z"
      fill="#00F5D4"
      opacity="0.9"
    />
  </g>

  <!-- Cyber Cyan Accent Jewels on the 3 Peaks -->
  <circle cx="17" cy="25" r="2" fill="#00F5D4" />
  <circle cx="32" cy="17" r="2.5" fill="#FFFFFF" stroke="#00F5D4" stroke-width="1" />
  <circle cx="47" cy="25" r="2" fill="#00F5D4" />

  <!-- Center subtle X monogram cut -->
  <path
    d="M29 37 L35 43 M35 37 L29 43"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linecap="round"
  />
</svg>

